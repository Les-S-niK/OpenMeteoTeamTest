<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Погода - Сочи</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Actor&family=Jura:wght@400;600&family=K2D:wght@400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="weather.css">
</head>
<body>

    <main class="weather-app">
        <!-- ЛЕВАЯ КОЛОНКА -->
        <div class="main-info">
            
            <header class="current-weather">
                <!-- Кнопка "назад" -->
                <a href="index.html" class="back-btn" aria-label="Назад">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                </a>

                <div class="location">
                    <h1>Сочи</h1>
                    <p class="condition">Ливень с грозой</p>
                </div>
                
                <div class="temperature-block">
                    <div class="temp-main">
                        <span class="temp-value">+21</span>
                        <span class="feels-like">Ощущается как +19</span>
                    </div>
                    <div class="weather-icon main-icon">
                        <img src="img/storm.png" alt="Гроза">
                    </div>
                </div>
                <p class="date">1 Июня</p>
            </header>

            <!-- Блок с часами -->
            <section class="hourly-forecast">
                <div class="hourly-scroll">
                    <div class="hourly-item">
                        <span class="time">0:00</span>
                        <div class="weather-icon small-icon">
                            <img src="img/rain.png" alt="Дождь">
                        </div>
                    </div>
                    <div class="hourly-item">
                        <span class="time">4:00</span>
                        <div class="weather-icon small-icon">
                            <img src="img/rain.png" alt="Дождь">
                        </div>
                    </div>
                    <div class="hourly-item">
                        <span class="time">8:00</span>
                        <div class="weather-icon small-icon">
                            <img src="img/cloud.png" alt="Облачно">
                        </div>
                    </div>
                    <div class="hourly-item">
                        <span class="time">12:00</span>
                        <div class="weather-icon small-icon">
                            <img src="img/storm.png" alt="Гроза">
                        </div>
                    </div>
                    <div class="hourly-item">
                        <span class="time">16:00</span>
                        <div class="weather-icon small-icon">
                            <img src="img/storm.png" alt="Гроза">
                        </div>
                    </div>
                    <div class="hourly-item">
                        <span class="time">20:00</span>
                        <div class="weather-icon small-icon">
                            <img src="img/cloud.png" alt="Облачно">
                        </div>
                    </div>
                    <div class="hourly-item">
                        <span class="time">0:00</span>
                        <div class="weather-icon small-icon">
                            <img src="img/cloud.png" alt="Облачно">
                        </div>
                    </div>
                </div>
            </section>

            <!-- Блок с деталями -->
            <section class="weather-details">
                <div class="detail-item">
                    <span class="detail-label">Влажность:</span>
                    <span class="detail-value">100%</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Давление:</span>
                    <span class="detail-value">705 <br> мм рт. ст.</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Ветер:</span>
                    <span class="detail-value">Штиль</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Вода:</span>
                    <span class="detail-value">+20</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">УФ-индекс:</span>
                    <span class="detail-value">6-7</span>
                </div>
            </section>
        </div>

        <!-- ПРАВАЯ КОЛОНКА -->
        <aside class="weekly-forecast">
            <div class="day-item">
                <span class="day-name">Пн 1 Июня</span>
                <span class="day-temp">+21</span>
                <div class="weather-icon day-icon">
                    <img src="img/storm.png" alt="Гроза">
                </div>
            </div>
            <div class="day-item">
                <span class="day-name">Вт 2 Июня</span>
                <span class="day-temp">+22</span>
                <div class="weather-icon day-icon">
                    <img src="img/cloud.png" alt="Облачно">
                </div>
            </div>
            <div class="day-item">
                <span class="day-name">Ср 3 Июня</span>
                <span class="day-temp">+25</span>
                <div class="weather-icon day-icon">
                    <img src="img/cloud-sun.png" alt="Облачно с прояснениями">
                </div>
            </div>
            <div class="day-item">
                <span class="day-name">Чт 4 Июня</span>
                <span class="day-temp">+27</span>
                <div class="weather-icon day-icon">
                    <img src="img/sun.png" alt="Ясно">
                </div>
            </div>
            <div class="day-item">
                <span class="day-name">Пт 5 Июня</span>
                <span class="day-temp">+28</span>
                <div class="weather-icon day-icon">
                    <img src="img/sun.png" alt="Ясно">
                </div>
            </div>
            <div class="day-item">
                <span class="day-name">Сб 6 Июня</span>
                <span class="day-temp">+28</span>
                <div class="weather-icon day-icon">
                    <img src="img/sun.png" alt="Ясно">
                </div>
            </div>
            <div class="day-item">
                <span class="day-name">Вс 7 Июня</span>
                <span class="day-temp">+30</span>
                <div class="weather-icon day-icon">
                    <img src="img/sun.png" alt="Ясно">
                </div>
            </div>
        </aside>
    </main>

</body>
</html>
